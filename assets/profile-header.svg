<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Ionuț — software systems and applied computing</title>
  <desc id="desc">A dark technical banner with a cyan and violet grid, system traces, and the name Ionuț.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1425"/>
      <stop offset="1" stop-color="#15102b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#46e6d2"/>
      <stop offset="1" stop-color="#8c7cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#80a8d8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <radialGradient id="aura">
      <stop stop-color="#4165a8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4165a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <ellipse cx="975" cy="155" rx="310" ry="230" fill="url(#aura)"/>
  <path d="M0 285H1200" stroke="#9bbbe8" stroke-opacity=".12"/>
  <path d="M42 0V330M1158 0V330" stroke="#9bbbe8" stroke-opacity=".09"/>
  <path d="M720 0V76h46v22h52v-39h64v72h74v-28h48v45h48" fill="none" stroke="url(#glow)" stroke-opacity=".66" stroke-width="2"/>
  <path d="M738 330v-39h70v-30h42v17h65v-54h70v24h54v-41h86" fill="none" stroke="url(#glow)" stroke-opacity=".45" stroke-width="2"/>
  <g fill="#46e6d2">
    <circle cx="720" cy="76" r="3"/><circle cx="882" cy="59" r="3"/><circle cx="1004" cy="131" r="3"/>
    <circle cx="850" cy="278" r="3"/><circle cx="985" cy="224" r="3"/><circle cx="1086" cy="183" r="3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="83" fill="#72eadc" font-size="14" letter-spacing="4">IONUTZZZZZ / ENGINEERING PROFILE</text>
    <text x="66" y="166" fill="#f0f5ff" font-size="65" font-weight="700" letter-spacing="-2">Ionuț</text>
    <rect x="70" y="191" width="76" height="3" rx="1.5" fill="url(#glow)"/>
    <text x="70" y="229" fill="#b8c8e0" font-size="18" letter-spacing="2">SOFTWARE SYSTEMS  ·  APPLIED COMPUTING</text>
    <text x="70" y="296" fill="#7186a5" font-size="12" letter-spacing="2">CLJ, RO  /  BUILD • MEASURE • ITERATE</text>
    <text x="1092" y="296" fill="#7186a5" font-size="12" text-anchor="end">EST. CURIOSITY // ON</text>
  </g>
  <rect x="1" y="1" width="1198" height="328" rx="21" fill="none" stroke="#9bbbe8" stroke-opacity=".18"/>
